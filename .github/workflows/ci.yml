name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - name: Validate shell scripts
        run: bash -n agent/install.sh agent/logos-observer-agent.sh
      - name: Enforce visual constraints
        run: |
          ! grep -RniE 'gradient|#000000|#ffffff' web
